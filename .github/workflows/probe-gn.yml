name: Probe GN
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Google News query variants
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          probe () {
            body=$(curl -s -m 30 -A "$UA" "$1")
            n=$(printf '%s' "$body" | grep -o "<item>" | wc -l)
            oldest=$(printf '%s' "$body" | grep -o "<pubDate>[^<]*" | sed 's/<pubDate>//' | tail -1)
            newest=$(printf '%s' "$body" | grep -o "<pubDate>[^<]*" | sed 's/<pubDate>//' | head -1)
            echo "$2 => $n 条 | 新:$newest | 旧:$oldest"
            sleep 3
          }
          B='https://news.google.com/rss/search?q='
          T='&hl=en-US&gl=US&ceid=US:en'
          echo "---- 基线（现行配置写法）----"
          probe "${B}%22marine+coatings%22+OR+antifouling+OR+%22foul+release%22+ship${T}&num=100" "baseline coating"
          probe "${B}PSPC+OR+%22performance+standard+for+protective+coatings%22${T}&num=100" "baseline pspc"
          echo "---- when:14d ----"
          probe "${B}%22marine+coatings%22+OR+antifouling+OR+%22foul+release%22+ship+when:14d${T}&num=100" "when14d coating"
          probe "${B}PSPC+OR+%22performance+standard+for+protective+coatings%22+when:14d${T}&num=100" "when14d pspc"
          echo "---- when:30d ----"
          probe "${B}%22marine+coatings%22+OR+antifouling+OR+%22foul+release%22+ship+when:30d${T}&num=100" "when30d coating"
          probe "${B}PSPC+OR+%22performance+standard+for+protective+coatings%22+when:30d${T}&num=100" "when30d pspc"
          echo "---- 首条样例 ----"
          curl -s -m 30 -A "$UA" "${B}%22marine+coatings%22+OR+antifouling+when:14d${T}&num=100" | head -c 600
